[project]
name = "converse"
version = "1.0.0"
description = "Live voice conversation service: speech to text, chat model, text to speech"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.0",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
    "websockets>=13.0",
    "python-dotenv==1.2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# main-voice gate (src/voicegate.py); `uv sync --extra voice`
voice = ["numpy>=1.26", "onnxruntime>=1.18"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
